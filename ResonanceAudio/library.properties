sentence=Google Resonance Audio spatial audio for Processing (binaural + 16-channel 3rd order Ambisonics B-format output).
paragraph=Port of the Google Resonance Audio engine (originally written for Android) to desktop Java via JNI. Renders mono/stereo sound files with HRTF-based binaural audio (headphones) or exports the intermediate ambisonic soundfield as undecoded 3rd order B-format (ACN/SN3D, 16 channels) for loudspeaker-array decoders. Includes integration with the Processing Sound library. Currently Windows x64 only.
