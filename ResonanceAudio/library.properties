sentence=Google Resonance Audio spatial audio for Processing (HRTF binaural, Ambisonics, and loudspeaker decoding).
paragraph=Port of the Google Resonance Audio engine to desktop Java via JNI. Renders mono/stereo sound files with HRTF-based binaural audio, exports 1st/2nd/3rd order Ambisonics B-format (ACN/SN3D), or decodes Ambisonics to loudspeaker arrays using precomputed matrices. Includes integration with the Processing Sound library and ASIO examples. Windows, macOS (Intel and Apple Silicon), and Linux (x64 and arm64) are supported.
