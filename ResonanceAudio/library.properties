sentence=HRTF binaural and 1st-3rd order Ambisonics spatial audio for Processing, with optional room reflections.
paragraph=An independent spatial audio library for Processing with HRTF binaural rendering for headphones, 1st/2nd/3rd order Ambisonics B-format output (ACN/SN3D), and Ambisonics-to-loudspeaker decoding from precomputed matrices. Room reflections and reverb can be enabled or disabled. Integrates with the Processing Sound library and includes ASIO output examples. Windows (x64 and arm64), macOS (Intel and Apple Silicon), and Linux (x64 and arm64) are supported.
